<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#050816" />
  <!-- Eyelid outline -->
  <path d="M 4 16 Q 16 7 28 16 Q 16 25 4 16 Z" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)" />
  <!-- Pupil -->
  <circle cx="16" cy="16" r="4.5" fill="none" stroke="#5CE1E6" stroke-width="1.2" />
  <circle cx="16" cy="16" r="1.5" fill="#00E5FF" />
  <!-- Morse symbol dot in top right, dash in bottom right -->
  <circle cx="25" cy="7" r="1.2" fill="#00E5FF" />
  <rect x="21" y="24" width="5" height="1.5" rx="0.75" fill="#00E5FF" />
</svg>
